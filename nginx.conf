worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    # Docker internal DNS — allows nginx to start even if some containers are down
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Default max upload size (override per-server as needed)
    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide server version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml text/javascript;
    gzip_proxied any;
    gzip_min_length 256;

    # Rate limiting for API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # WebSocket support (used by *arr SignalR, Jellyseerr, etc.)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Shared proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Jellyfin
    server {
        listen 80;
        server_name jellyfin.media.local;
        client_max_body_size 0;
        location / {
            set $upstream_jellyfin http://jellyfin:8096;
            proxy_pass $upstream_jellyfin;
            proxy_buffering off;
        }
    }

    # Sonarr
    server {
        listen 80;
        server_name sonarr.media.local;
        location / {
            set $upstream_sonarr http://sonarr:8989;
            proxy_pass $upstream_sonarr;
        }
    }

    # Sonarr Anime
    server {
        listen 80;
        server_name sonarr-anime.media.local;
        location / {
            set $upstream_sonarr_anime http://sonarr-anime:8989;
            proxy_pass $upstream_sonarr_anime;
        }
    }

    # Radarr
    server {
        listen 80;
        server_name radarr.media.local;
        location / {
            set $upstream_radarr http://radarr:7878;
            proxy_pass $upstream_radarr;
        }
    }

    # Prowlarr
    server {
        listen 80;
        server_name prowlarr.media.local;
        location / {
            set $upstream_prowlarr http://prowlarr:9696;
            proxy_pass $upstream_prowlarr;
        }
    }

    # Bazarr
    server {
        listen 80;
        server_name bazarr.media.local;
        location / {
            set $upstream_bazarr http://bazarr:6767;
            proxy_pass $upstream_bazarr;
        }
    }

    # SABnzbd
    server {
        listen 80;
        server_name sabnzbd.media.local;
        location / {
            set $upstream_sabnzbd http://sabnzbd:8080;
            proxy_pass $upstream_sabnzbd;
        }
    }

    # qBittorrent
    server {
        listen 80;
        server_name qbittorrent.media.local;
        location / {
            set $upstream_qbittorrent http://qbittorrent:8081;
            proxy_pass $upstream_qbittorrent;
        }
    }

    # Jellyseerr
    server {
        listen 80;
        server_name jellyseerr.media.local;
        location / {
            set $upstream_jellyseerr http://jellyseerr:5055;
            proxy_pass $upstream_jellyseerr;
        }
    }

    # Dozzle has no login of its own, so nginx publishes it (vhost and its
    # usual host port) behind basic auth. htpasswd is generated by setup.sh
    # from the Jellyfin credentials.

    # Dozzle (Docker logs — SSE requires buffering off)
    server {
        listen 80;
        listen 9999;
        server_name dozzle.media.local;
        auth_basic "Media Server";
        auth_basic_user_file /etc/nginx/htpasswd;
        location / {
            set $upstream_dozzle http://dozzle:8080;
            proxy_pass $upstream_dozzle;
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # Dashboard (catch-all)
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/landing;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy endpoints (keys injected by setup.sh)
        # Rate limiting (zone=api) is applied inside api-proxy.conf locations
        include /etc/nginx/api-proxy.conf;

        # Only the read-only endpoints listed in api-proxy.conf are exposed
        location /api/ {
            return 404;
        }

        # Friendly error page when a backend is down
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><title>Service Unavailable</title>
            <style>body{background:#0f0f1a;color:#e0e0e0;font-family:system-ui;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
            .msg{text-align:center}.msg h1{color:#e94560;font-size:2rem}.msg p{color:#7a7a9a;margin-top:0.5rem}</style></head>
            <body><div class="msg"><h1>Service Unavailable</h1><p>The backend service is starting up or unreachable. Try again in a moment.</p></div></body></html>';
        }
    }
}
