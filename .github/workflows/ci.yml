name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Evaluates every package and app without building the services
      - name: Flake Check
        run: nix flake check --no-build

      - name: Bash Syntax
        run: |
          for f in setup.sh install.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: nix develop -c shellcheck -x -S warning setup.sh install.sh

      # Setup and the services are Python (mediaserver/)
      - name: Pyright
        run: nix develop -c pyright

      - name: Ruff
        run: nix develop -c ruff check

      # Unit and failure-path tests against fake services, with a coverage
      # floor; no real services needed
      - name: Tests
        run: nix run .#unit
