name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Evaluates every package and app without building the services
      - name: Flake Check
        run: nix flake check --no-build

      - name: Bash Syntax
        run: |
          for f in setup.sh install.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: nix develop -c shellcheck -x -S warning setup.sh install.sh

      # Setup and the services are Python (mediaserver/)
      - name: Pyright
        run: nix develop -c pyright

      # Unit and failure-path tests against fake services, with a coverage
      # floor; no real services needed
      - name: Tests
        run: nix run .#unit

      # The example ships with password "changeme", which setup rejects on
      # purpose, so validate a copy with real-looking passwords.
      # MEDIA_SERVICES_JSON skips the re-exec through `nix run`.
      - name: Config Validation
        run: |
          export MEDIA_DIR="$RUNNER_TEMP/media" MEDIA_SERVICES_JSON=/dev/null
          mkdir -p "$MEDIA_DIR"
          sed 's/"changeme"/"ci-not-a-real-password"/' config.toml.example > "$MEDIA_DIR/config.toml"
          nix develop -c bash setup.sh --check-config

      - name: Nginx Config
        run: |
          nix develop -c bash -c '
            set -euo pipefail
            dir="$RUNNER_TEMP/nginx"
            mkdir -p "$dir/temp" "$dir/www"
            mime="$(dirname "$(dirname "$(command -v nginx)")")/conf/mime.types"
            python3 - "$dir" "$mime" <<PY
          import sys
          from pathlib import Path
          from mediaserver.steps.host import render
          out, mime = Path(sys.argv[1]), sys.argv[2]
          key = "0123456789abcdef"
          values = {"NGINX_MIME_TYPES": mime, "DASHBOARD_PORT": 8080, "ADMIN_HOST": "127.0.0.1",
                    "JELLYFIN_API_KEY": key, "SEERR_KEY": key, "SABNZBD_KEY": key}
          (out / "nginx.conf").write_text(render(Path("templates/nginx.conf.tpl"), values))
          (out / "api-proxy.conf").write_text(render(Path("templates/nginx.api-proxy.conf.tpl"), values))
          PY
            nginx -t -e stderr -p "$dir" -c "$dir/nginx.conf"
          '
