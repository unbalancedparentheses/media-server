name: Fresh install

# The whole lifecycle on a clean Mac: what a new user runs, on every push
# to main. The Mac is clean (no ~/media, no services); only the Nix store is
# restored from the previous run, the way a user's Nix fetches from a cache,
# so the services aren't rebuilt each time. Weekly too, and on demand.
on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "renovate.json"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

# One at a time, never cancelled: a run that finishes saves the Nix store for
# the next (a cancelled one wouldn't). A newer push replaces a waiting run.
concurrency:
  group: fresh-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      NIX_CONFIG: "extra-experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Uploads what this run builds (Seerr and SABnzbd are built from
      # source on a Mac) to the binary cache new installs download from.
      # Only once the repo has a CACHIX_CACHE variable and a
      # CACHIX_AUTH_TOKEN secret (Settings → Secrets and variables → Actions)
      - name: Binary cache
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The previous run's Nix store. Keyed on what decides the builds; a
      # change restores the closest older store and rebuilds only what
      # changed. Before saving, garbage beyond 7 GB (build-only leftovers)
      # is collected; what the services run is kept by the root below.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 7G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Uninstall (the last step) removes the install's own GC root; this one
      # keeps the services in the store that gets saved
      - name: Build
        run: nix build .#default .#manifest --out-link "$RUNNER_TEMP/keep"

      - name: Fresh install
        run: nix run .#install -- --yes

      - name: Checks
        run: nix run .#test

      - name: Re-run changes nothing
        run: |
          nix run .#install -- --yes | tee rerun.log
          if grep -E "restarted with new settings|login set:|published|updated\)|\(created\)|folder fixed" rerun.log; then
            echo "::error::A re-run with an unchanged config.toml changed something (above)"
            exit 1
          fi

      - name: Config change
        run: |
          sed -i '' 's/^want = "first"/want = "all"/; s/^prefer_h265 = true/prefer_h265 = false/; s/^upload_limit_kib = 100 /upload_limit_kib = 0 /' ~/media/config.toml
          nix run .#install -- --yes
          nix run .#test

      - name: Invalid config is rejected before anything changes
        run: |
          cp ~/media/config.toml config.good
          sed -i '' 's/^prefer_h265 =/prefer_h256 =/' ~/media/config.toml
          if nix run .#install -- --yes > invalid.log 2>&1; then
            echo "::error::An unknown setting was accepted"; exit 1
          fi
          grep -q 'did you mean "prefer_h265"' invalid.log
          cp config.good ~/media/config.toml

      - name: End-to-end
        run: nix run .#e2e

      - name: Doctor
        run: nix run .#doctor || true   # public indexers vary; informational

      - name: Backup and restore
        run: |
          nix run .#backup
          nix run .#restore -- "$(ls -t ~/media/backups/media-server_*.tar.gz | head -1)" --yes
          nix run .#install -- --yes
          nix run .#test

      - name: Uninstall leaves nothing running
        run: |
          nix run .#uninstall -- --purge --yes
          if ls ~/Library/LaunchAgents/org.media-server.* 2>/dev/null; then
            echo "::error::launchd agents left behind"; exit 1
          fi
          if launchctl list | grep org.media-server; then
            echo "::error::services still loaded"; exit 1
          fi
          [ ! -e ~/media/config ] || { echo "::error::configs left behind after --purge"; exit 1; }

      - name: Logs
        if: failure()
        run: |
          tail -n 60 ~/media/logs/*.log 2>/dev/null || true
