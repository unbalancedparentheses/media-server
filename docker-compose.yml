x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Streaming ──────────────────────────────────────────────────
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ~/media/config/jellyfin:/config
      - ~/media/movies:/media/movies
      - ~/media/tv:/media/tv
      - ~/media/anime:/media/anime
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    environment:
      - ND_SCANSCHEDULE=15m
      - ND_LOGLEVEL=info
      - ND_MUSICFOLDER=/music
    ports:
      - "4533:4533"
    volumes:
      - ~/media/config/navidrome:/data
      - ~/media/music:/music:ro
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Requests & Automation ──────────────────────────────────────
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    container_name: jellyseerr
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - TZ=${TZ:-America/New_York}
    ports:
      - "5055:5055"
    volumes:
      - ~/media/config/jellyseerr:/app/config
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      sonarr-anime:
        condition: service_healthy
      radarr:
        condition: service_healthy

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    container_name: sonarr
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8989:8989"
    volumes:
      - ~/media/config/sonarr:/config
      - ~/media/tv:/media/tv
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy

  sonarr-anime:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    container_name: sonarr-anime
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8990:8989"
    volumes:
      - ~/media/config/sonarr-anime:/config
      - ~/media/anime:/media/anime
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
    container_name: radarr
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:7878:7878"
    volumes:
      - ~/media/config/radarr:/config
      - ~/media/movies:/media/movies
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls42
    container_name: lidarr
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8686:8686"
    volumes:
      - ~/media/config/lidarr:/config
      - ~/media/music:/media/music
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    container_name: prowlarr
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:9696:9696"
    volumes:
      - ~/media/config/prowlarr:/config
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      flaresolverr:
        condition: service_healthy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      - TZ=${TZ:-America/New_York}
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.1-ls365
    container_name: bazarr
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:6767:6767"
    volumes:
      - ~/media/config/bazarr:/config
      - ~/media/movies:/media/movies
      - ~/media/tv:/media/tv
      - ~/media/anime:/media/anime
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    container_name: recyclarr
    environment:
      - TZ=${TZ:-America/New_York}
      - CRON_SCHEDULE=@weekly
    volumes:
      - ~/media/config/recyclarr:/config
    logging: *logging
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      sonarr-anime:
        condition: service_healthy
      radarr:
        condition: service_healthy

  janitorr:
    image: ghcr.io/schaka/janitorr:jvm-v2.2.2
    container_name: janitorr
    user: "${PUID:-501}:${PGID:-20}"
    volumes:
      - ~/media/config/janitorr/application.yml:/config/application.yml:ro
      - ~/media/config/janitorr/logs:/logs
      - ~/media/movies:/media/movies
      - ~/media/tv:/media/tv
      - ~/media/anime:/media/anime
      - ~/media/leaving-soon:/media/leaving-soon
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      jellyfin:
        condition: service_healthy

  # ── Downloads ──────────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls477
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=8081
    # Ports and network_mode are set in docker-compose.override.yml
    # (generated by setup.sh based on VPN_ENABLE in config.toml)
    volumes:
      - ~/media/config/qbittorrent:/config
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls274
    container_name: sabnzbd
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ~/media/config/sabnzbd:/config
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  unpackerr:
    image: golift/unpackerr:v0.16.1
    container_name: unpackerr
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ~/media/config/unpackerr:/etc/unpackerr
      - ~/media/downloads:/downloads
    logging: *logging
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      sonarr-anime:
        condition: service_healthy
      radarr:
        condition: service_healthy
      lidarr:
        condition: service_healthy

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ:-America/New_York}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-mullvad}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-}
    volumes:
      - ~/media/config/gluetun:/gluetun
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider https://1.1.1.1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Transcoding ────────────────────────────────────────────────
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.90.01
    container_name: tdarr
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      - PUID=${PUID:-501}
      - PGID=${PGID:-20}
      - TZ=${TZ:-America/New_York}
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=InternalNode
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8266:8266"
    volumes:
      - ~/media/config/tdarr/server:/app/server
      - ~/media/config/tdarr/configs:/app/configs
      - ~/media/config/tdarr/logs:/app/logs
      - ~/media/movies:/media/movies
      - ~/media/tv:/media/tv
      - ~/media/anime:/media/anime
      - ~/media/music:/media/music
      - ~/media/transcode_cache:/temp
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8265 || curl -fsS http://localhost:8265 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Photos ─────────────────────────────────────────────────────
  immich:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    container_name: immich
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "2283:2283"
    environment:
      - TZ=${TZ:-America/New_York}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      # Keep the pre-v2 upload path; Immich's own default moved to /data
      - IMMICH_MEDIA_LOCATION=/usr/src/app/upload
    volumes:
      - ~/media/photos:/usr/src/app/upload
    logging: *logging
    restart: unless-stopped
    healthcheck:
      disable: false  # use the image's built-in check (as Immich's compose does)
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
      immich-machine-learning:
        condition: service_healthy

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    container_name: immich-machine-learning
    volumes:
      - ~/media/config/immich-ml:/cache
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      disable: false  # use the image's built-in check (as Immich's compose does)

  immich-redis:
    image: valkey/valkey:9.1.2-alpine
    container_name: immich-redis
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  immich-postgres:
    # Includes pgvecto.rs so databases created with the old tensorchord image
    # can be migrated to VectorChord (see migrate_immich_vectors in setup.sh)
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ~/media/config/immich-postgres:/var/lib/postgresql/data
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Infrastructure ─────────────────────────────────────────────
  nginx:
    image: nginx:1.31.6-alpine
    container_name: media-nginx
    ports:
      - "80:80"
      # Tdarr, Dozzle and Scrutiny have no login of their own; nginx fronts
      # them on their usual ports with basic auth (see nginx.conf)
      - "${ADMIN_BIND:-0.0.0.0}:8265:8265"
      - "${ADMIN_BIND:-0.0.0.0}:9999:9999"
      - "${ADMIN_BIND:-0.0.0.0}:9091:9091"
    networks:
      default:
        # Fixed address: qBittorrent skips its login only for this IP
        ipv4_address: ${NGINX_IP:-172.29.84.10}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landing.html:/usr/share/nginx/landing/index.html:ro
      - ./admin.html:/usr/share/nginx/landing/admin.html:ro
      - ~/media/config/nginx/api-proxy.conf:/etc/nginx/api-proxy.conf:ro
      - ~/media/config/nginx/htpasswd:/etc/nginx/htpasswd:ro
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dozzle:
    image: amir20/dozzle:v11.1.1
    container_name: dozzle
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  beszel:
    image: henrygd/beszel:0.20.0
    container_name: beszel
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:8090:8090"
    volumes:
      - ~/media/config/beszel:/beszel_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/api/health || curl -fsS http://localhost:8090/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  beszel-agent:
    image: henrygd/beszel-agent:0.20.0
    container_name: beszel-agent
    network_mode: host
    environment:
      - PORT=45876
      - KEY=${BESZEL_AGENT_KEY:-}  # Generate from Beszel web UI → Add System
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: uptime-kuma
    ports:
      - "${ADMIN_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - ~/media/config/uptime-kuma:/app/data
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/entry-page', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.9.4-omnibus
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
    volumes:
      - ~/media/config/scrutiny:/opt/scrutiny/config
      - /run/udev:/run/udev:ro
    # Add your disk devices below, e.g.:
    # devices:
    #   - /dev/sda
    #   - /dev/sdb
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.84.0/24}
          # Dynamic addresses come from the upper half, so nginx's fixed
          # address in the lower half is never taken by another container
          ip_range: ${DOCKER_IP_RANGE:-172.29.84.128/25}
